<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>A Surprise For You, Niyati ✨</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
/* ── Reset & tokens ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --mint:  #A8FFD8;
  --bone:  #F2EDE4;
  --black: #000000;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans:  'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: var(--black);
  color: var(--bone);
  font-family: var(--font-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ── Utility ──────────────────────────────────────────────── */
.font-serif { font-family: var(--font-serif); }

.glow-mint  { text-shadow: 0 0 20px rgba(168,255,216,.45), 0 0 40px rgba(168,255,216,.2); }
.glow-bone  { text-shadow: 0 0 24px rgba(242,237,228,.35); }

/* ── Glass helpers ────────────────────────────────────────── */
.glass-card {
  background: rgba(18,22,20,.55);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(168,255,216,.2);
  box-shadow: 0 20px 50px rgba(0,0,0,.8), 0 0 30px rgba(168,255,216,.08);
}

.glass-btn {
  background: rgba(168,255,216,.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(168,255,216,.4);
  box-shadow: 0 0 25px rgba(168,255,216,.2), inset 0 0 15px rgba(168,255,216,.1);
  transition: all .4s cubic-bezier(.16,1,.3,1);
  cursor: pointer;
  color: var(--bone);
  font-family: var(--font-serif);
}
.glass-btn:hover, .glass-btn:focus-visible {
  background: rgba(168,255,216,.18);
  border-color: rgba(168,255,216,.8);
  box-shadow: 0 0 45px rgba(168,255,216,.5), inset 0 0 20px rgba(168,255,216,.25);
  transform: scale(1.05);
  outline: none;
}
.glass-btn:active { transform: scale(.97); }

/* ── Animations ───────────────────────────────────────────── */
@keyframes pulseAura {
  0%,100% { transform:scale(.95); opacity:.35; }
  50%      { transform:scale(1.3);  opacity:.8; }
}
.anim-aura { animation: pulseAura 3.6s ease-in-out infinite; }

@keyframes floatParticle {
  0%   { transform:translateY(0) rotate(0deg);   opacity:0; }
  20%  { opacity:.8; }
  80%  { opacity:.8; }
  100% { transform:translateY(-90px) rotate(45deg); opacity:0; }
}

@keyframes gentleBeat {
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.18); }
}
.anim-heart { animation: gentleBeat 2.2s ease-in-out infinite; }

/* typewriter cursor blink */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.cursor { display:inline-block; animation:blink 1s step-end infinite; color:var(--mint); }

/* CSS starfield fallback */
@keyframes cssStarDrift {
  from { transform:translateY(0) translateX(0) scale(1); opacity:1; }
  to   { transform:translateY(-120vh) translateX(var(--tx,0)) scale(3); opacity:0; }
}

/* ── Screen transitions ───────────────────────────────────── */
.screen {
  transition: opacity 1.1s cubic-bezier(.2,.9,.3,1),
              transform 1.2s cubic-bezier(.16,1,.3,1);
}
.screen.state-active  { opacity:1;  transform:scale(1);    pointer-events:auto; }
.screen.state-enter   { opacity:0;  transform:scale(.85);  pointer-events:none; }
.screen.state-exit    { opacity:0;  transform:scale(2.2);  pointer-events:none; }

/* ── Photo card ───────────────────────────────────────────── */
.photo-card {
  transition: transform .5s cubic-bezier(.2,.8,.2,1),
              box-shadow .5s ease;
  box-shadow: 0 0 30px rgba(168,255,216,.18), 0 20px 40px rgba(0,0,0,.9);
}
.photo-card:hover { box-shadow: 0 0 50px rgba(168,255,216,.35), 0 25px 50px rgba(0,0,0,.95); }

/* ── Photo fallback (shown if img fails) ──────────────────── */
.photo-fallback {
  display:none;
  width:100%; height:100%;
  align-items:center; justify-content:center;
  background: radial-gradient(circle, rgba(168,255,216,.15) 0%, rgba(0,0,0,.8) 70%);
  border-radius:1rem;
}
.photo-fallback span { font-size:4rem; filter:drop-shadow(0 0 20px var(--mint)); }

/* ── Mute toggle button ───────────────────────────────────── */
#mute-btn {
  position:fixed; bottom:1.25rem; right:1.25rem; z-index:100;
  width:48px; height:48px; border-radius:50%;
  background:rgba(168,255,216,.12);
  border:1px solid rgba(168,255,216,.35);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  font-size:1.2rem; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .3s;
  color:var(--bone);
  box-shadow:0 0 16px rgba(168,255,216,.2);
}
#mute-btn:hover { background:rgba(168,255,216,.25); transform:scale(1.1); }
#mute-btn.hidden { display:none; }

/* ── Layout ───────────────────────────────────────────────── */
#root {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
}

#starfield-bg {
  position:absolute; inset:0; z-index:0;
  overflow:hidden; transition:all 1s;
}
#starfield-bg canvas { display:block; width:100%; height:100%; }

#particles { position:absolute; inset:0; pointer-events:none; z-index:10; overflow:hidden; }

main {
  position:relative; z-index:20;
  width:100%; max-width:440px;
  height:100dvh; height:100vh; /* dvh first, vh fallback */
  display:flex; flex-direction:column; align-items:center;
  justify-content:space-between;
  padding: env(safe-area-inset-top, 1rem) 1.5rem
           env(safe-area-inset-bottom, 1rem) 1.5rem;
}

/* ── Header ───────────────────────────────────────────────── */
.hdr {
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(168,255,216,.6); font-weight:300;
  padding-top:.5rem;
}
.hdr-dot { width:6px; height:6px; border-radius:50%; background:var(--mint); animation:pulseAura 2s ease-in-out infinite; display:inline-block; }

/* ── Screen 1 ─────────────────────────────────────────────── */
#screen-1 {
  flex:1; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:1rem;
  position:relative;
}

.badge {
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.375rem 1rem; border-radius:9999px;
  background:rgba(168,255,216,.1); border:1px solid rgba(168,255,216,.3);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  margin-bottom:2rem;
  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--mint); font-weight:500;
}

h1.headline {
  font-family:var(--font-serif);
  font-size:clamp(2rem,8vw,3rem);
  font-weight:300; line-height:1.25; letter-spacing:.03em;
  color:var(--bone); margin-bottom:.75rem;
}
h1.headline span { font-style:italic; color:var(--mint); }

.sub-label {
  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(242,237,228,.6); font-weight:300; margin-bottom:3rem;
}

.btn-wrap { position:relative; display:flex; align-items:center; justify-content:center; }
.btn-aura1 { position:absolute; width:11rem; height:4rem; border-radius:9999px; background:rgba(168,255,216,.2); filter:blur(20px); pointer-events:none; }
.btn-aura2 { position:absolute; width:9rem;  height:3rem; border-radius:9999px; background:rgba(168,255,216,.3); filter:blur(8px); pointer-events:none; animation:pulseAura 3.6s ease-in-out infinite; }

#open-btn {
  position:relative;
  display:flex; align-items:center; gap:.75rem;
  padding:.875rem 2.25rem; border-radius:9999px;
  font-size:1.1rem; letter-spacing:.06em; min-height:48px;
}
#open-btn .btn-dot { width:6px; height:6px; border-radius:50%; background:var(--mint); }

/* ── Screen 2 ─────────────────────────────────────────────── */
#screen-2 {
  position:absolute;
  inset:0; top:4rem; bottom:0;
  max-width:440px; width:100%; margin:0 auto;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; text-align:center;
  padding:0 1.5rem 1rem;
  overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; -ms-overflow-style:none;
}
#screen-2::-webkit-scrollbar { display:none; }

.s2-date {
  font-size:.65rem; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(168,255,216,.8); font-weight:500; margin-bottom:.25rem; margin-top:1rem;
}
h2.reveal-title {
  font-family:var(--font-serif);
  font-size:clamp(1.6rem,6vw,2.25rem);
  font-weight:300; letter-spacing:.03em; color:var(--bone);
  margin-bottom:1rem;
}
h2.reveal-title span { font-style:italic; color:var(--mint); }

/* ── Photo frame ──────────────────────────────────────────── */
.photo-wrap {
  width:min(270px, 72vw); aspect-ratio:1;
  perspective:1000px; margin:0 auto .75rem;
}
.photo-card {
  width:100%; height:100%; border-radius:1rem;
  overflow:hidden; position:relative;
  border:1px solid rgba(168,255,216,.4);
  background:#0a0a0a;
}
.photo-card img {
  width:100%; height:100%; object-fit:cover; object-position:center top;
  filter:brightness(.95) contrast(1.05);
  transition:transform .7s ease-out;
  display:block;
}
.photo-card:hover img { transform:scale(1.05); }
.photo-card .gloss { position:absolute; inset:0; background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,.08) 70%, rgba(168,255,216,.15) 100%); pointer-events:none; }
.photo-card .ring  { position:absolute; inset:0; border-radius:1rem; box-shadow:inset 0 0 0 1px rgba(168,255,216,.25); pointer-events:none; }
.photo-card .spark-tl { position:absolute; top:.6rem; right:.6rem; font-size:.7rem; color:var(--mint); filter:drop-shadow(0 0 6px var(--mint)); }
.photo-card .spark-br { position:absolute; bottom:.6rem; left:.6rem; font-size:.7rem; color:var(--mint); filter:drop-shadow(0 0 6px var(--mint)); }

/* fallback heart frame */
.photo-fallback { display:none; width:100%; height:100%; align-items:center; justify-content:center; flex-direction:column; gap:.5rem; }
.photo-fallback .heart-icon { font-size:3.5rem; filter:drop-shadow(0 0 24px var(--mint)); animation:gentleBeat 2.2s ease-in-out infinite; }
.photo-fallback p { font-size:.75rem; color:rgba(168,255,216,.7); letter-spacing:.08em; }

/* ── Message card ─────────────────────────────────────────── */
.msg-card {
  width:100%; border-radius:1rem; padding:1.25rem 1.5rem;
  margin-top:.5rem; text-align:left; position:relative; overflow:hidden;
}
.msg-card .deco { position:absolute; top:0; right:0; width:7rem; height:7rem; background:rgba(168,255,216,.1); border-radius:50%; filter:blur(2rem); pointer-events:none; }

#typewriter-text {
  font-family:var(--font-serif);
  font-size:clamp(.9rem,3vw,1.05rem);
  color:var(--bone); line-height:1.75; font-weight:300; letter-spacing:.02em;
  min-height:5em; display:block;
}

.card-footer {
  margin-top:.75rem; padding-top:.75rem;
  border-top:1px solid rgba(168,255,216,.15);
  display:flex; align-items:center; justify-content:space-between;
}
.signature { font-family:var(--font-serif); font-style:italic; font-size:1rem; color:rgba(242,237,228,.9); letter-spacing:.04em; }
.signature strong { color:var(--mint); font-style:normal; font-weight:500; }

#replay-btn {
  font-size:.65rem; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(168,255,216,.7); background:transparent;
  border:1px solid rgba(168,255,216,.25); border-radius:9999px;
  padding:.35rem .75rem; cursor:pointer; display:flex; align-items:center; gap:.35rem;
  transition:all .3s; min-height:36px; font-family:var(--font-sans);
}
#replay-btn:hover { color:var(--mint); background:rgba(168,255,216,.1); border-color:rgba(168,255,216,.5); }

.footnote { padding:.5rem 0; display:flex; align-items:center; gap:.5rem; font-size:.7rem; color:rgba(242,237,228,.5); }

/* ── Footer ───────────────────────────────────────────────── */
.ftr {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  font-size:.65rem; color:rgba(242,237,228,.5); padding-bottom:.5rem;
  letter-spacing:.08em;
}
.ftr-pulse { display:inline-flex; align-items:center; gap:.4rem; color:rgba(168,255,216,.7); }
.ftr-pulse::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--mint); animation:pulseAura 2s ease-in-out infinite; }

/* ── CSS starfield fallback ───────────────────────────────── */
.css-star {
  position:absolute; border-radius:50%;
  background:var(--mint); animation:cssStarDrift linear infinite;
}
</style>
</head>

<body>
<div id="root">

  <!-- ── BACKGROUND: WebGL starfield (or CSS fallback) ── -->
  <div id="starfield-bg"></div>

  <!-- Vignette overlays -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:1;"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 25%,transparent 75%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:1;"></div>

  <!-- ── AMBIENT PARTICLES ── -->
  <div id="particles"></div>

  <!-- ── MUTE BUTTON (shown after audio starts) ── -->
  <button id="mute-btn" class="hidden" aria-label="Toggle music">🔊</button>

  <!-- ── MAIN LAYOUT ── -->
  <main>

    <!-- Header -->
    <header class="hdr">
      <div style="display:flex;align-items:center;gap:.4rem;">
        <span class="hdr-dot"></span>
        <span>11 · 11 · 2026</span>
      </div>
      <span>Niyati's Universe</span>
    </header>

    <!-- ══ SCREEN 1 ══ -->
    <section id="screen-1" class="screen state-active">
      <div class="badge">
        <span>✨</span>
        <span>Cosmic Celebration</span>
      </div>

      <h1 class="headline glow-mint">
        A surprise for you,<br/>
        <span>Niyati</span> ✨
      </h1>

      <p class="sub-label">Tap to open your gift</p>

      <div class="btn-wrap">
        <div class="btn-aura1 anim-aura"></div>
        <div class="btn-aura2"></div>
        <button id="open-btn" class="glass-btn" aria-label="Open surprise">
          <span style="font-size:1.2rem;">💫</span>
          <span>Open</span>
          <span class="btn-dot"></span>
        </button>
      </div>

      <p style="margin-top:3rem;font-size:.65rem;color:rgba(242,237,228,.35);letter-spacing:.08em;">A special universe crafted just for you</p>
    </section>

    <!-- ══ SCREEN 2 ══ -->
    <section id="screen-2" class="screen state-enter" aria-hidden="true">

      <p class="s2-date">11th November 2026</p>
      <h2 class="reveal-title glow-mint">
        Happy Birthday, <span>Niyati</span> 🎂
      </h2>

      <!-- Photo frame -->
      <div class="photo-wrap">
        <div class="photo-card" id="photo-card">
          <img
            id="hero-img"
            src="./assets/photo.jpg"
            alt="A birthday surprise from Avik for Niyati"
            loading="eager"
          />
          <!-- fallback if image fails -->
          <div class="photo-fallback" id="photo-fallback" aria-hidden="true">
            <span class="heart-icon">🤍</span>
            <p>✦ for Niyati ✦</p>
          </div>
          <div class="gloss"></div>
          <div class="ring"></div>
          <div class="spark-tl">✦</div>
          <div class="spark-br">✦</div>
        </div>
      </div>

      <!-- Glass message card -->
      <div class="msg-card glass-card">
        <div class="deco"></div>

        <span id="typewriter-text" role="status" aria-live="polite"></span>

        <div class="card-footer">
          <p class="signature">Forever yours, <strong>Avik</strong></p>
          <button id="replay-btn" aria-label="Replay from beginning">↺ Replay</button>
        </div>
      </div>

      <div class="footnote">
        <span>✨</span>
        <span style="letter-spacing:.08em;">Made with endless love</span>
        <span>✨</span>
      </div>

    </section>

    <!-- Footer -->
    <footer class="ftr">
      <span class="ftr-pulse">Starlight Warp Active</span>
      <span>∞ / ∞</span>
    </footer>

  </main>
</div><!-- #root -->

<script>
/* ═══════════════════════════════════════════════════════
   STARFIELD: WebGL star-tunnel with CSS fallback
═══════════════════════════════════════════════════════ */
(function initStarfield() {
  var container = document.getElementById('starfield-bg');

  // --- Try WebGL ---
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'display:block;width:100%;height:100%;position:absolute;inset:0;';
  container.appendChild(canvas);

  function syncSize() {
    var w = canvas.clientWidth  || 1280;
    var h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  if (typeof ResizeObserver !== 'undefined') { new ResizeObserver(syncSize).observe(canvas); }
  syncSize();

  var gl = null;
  try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch(e) {}

  if (!gl) {
    // ── CSS starfield fallback ──────────────────────────
    canvas.remove();
    container.style.cssText = 'position:absolute;inset:0;overflow:hidden;';
    for (var i = 0; i < 120; i++) {
      var s = document.createElement('div');
      s.className = 'css-star';
      var size = 1 + Math.random() * 2.5;
      var dur  = 4 + Math.random() * 10;
      var tx   = (Math.random() - .5) * 40;
      s.style.cssText = [
        'width:' + size + 'px',
        'height:' + size + 'px',
        'left:' + (Math.random() * 100) + '%',
        'top:' + (Math.random() * 100) + '%',
        'opacity:' + (Math.random() * .8 + .2),
        '--tx:' + tx + 'vw',
        'animation-duration:' + dur + 's',
        'animation-delay:-' + (Math.random() * dur) + 's',
        'background:' + (Math.random() > .5 ? '#A8FFD8' : '#F2EDE4')
      ].join(';');
      container.appendChild(s);
    }
    return;
  }

  // ── WebGL star tunnel shader ───────────────────────────
  var vs = [
    'attribute vec2 a_pos;',
    'void main(){gl_Position=vec4(a_pos,0.,1.);}',
  ].join('\n');

  var fs = [
    'precision highp float;',
    'uniform float u_time;',
    'uniform vec2  u_res;',
    'uniform vec2  u_mouse;',
    'float hash(vec2 p){',
    '  p=fract(p*vec2(123.34,456.21));',
    '  p+=dot(p,p+45.32);',
    '  return fract(p.x*p.y);',
    '}',
    'void main(){',
    '  vec2 uv=(gl_FragCoord.xy-.5*u_res)/min(u_res.y,u_res.x);',
    '  float r=length(uv);',
    '  float a=atan(uv.y,uv.x);',
    '  vec3 col=vec3(.002,.005,.004);',
    '  float spd=u_time*.85;',
    '  for(float i=1.;i<=3.;i+=1.){',
    '    float d=(1./(r+.04))+spd*(.8+i*.4);',
    '    float as=a*(4.+i*2.)/3.14159265;',
    '    vec2 g=vec2(as,d);',
    '    vec2 id=floor(g);',
    '    vec2 gv=fract(g)-.5;',
    '    float h=hash(id+i*37.1);',
    '    if(h>.45){',
    '      vec2 off=vec2(hash(id*1.3)-.5,hash(id*2.7)-.5)*.6;',
    '      vec2 dv=gv-off;',
    '      dv.y*=.35+.65*(r*1.5);',
    '      float dist=length(dv);',
    '      vec3 sc=(h>.72)?vec3(.659,1.,.847):vec3(.95,.93,.89);',
    '      float core=.015/(dist+.001);',
    '      float halo=.04/(dist*dist*8.+.08);',
    '      float df=smoothstep(.05,.35,r)*smoothstep(1.3,.5,r);',
    '      float tw=.7+.3*sin(u_time*3.+h*6.28);',
    '      col+=sc*(core*.4+halo*.7)*df*tw;',
    '    }',
    '  }',
    '  float cg=.04/(r+.15);',
    '  col+=vec3(.12,.45,.32)*cg*.4;',
    '  col*=smoothstep(1.4,.3,r);',
    '  gl_FragColor=vec4(col,1.);',
    '}',
  ].join('\n');

  function mkShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    return sh;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  var uTime  = gl.getUniformLocation(prog, 'u_time');
  var uRes   = gl.getUniformLocation(prog, 'u_res');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');

  var mouse = { x: canvas.width/2, y: canvas.height/2 };
  window.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      mouse.x = ((e.clientX - rect.left) / rect.width) * canvas.width;
      mouse.y = (1 - (e.clientY - rect.top) / rect.height) * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(uTime,  t * .001);
    gl.uniform2f(uRes,   canvas.width, canvas.height);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();

(function spawnParticles() {
  var container = document.getElementById('particles');
  var glyphs = ['✦','•','⋆','🤍','✨'];
  for (var i = 0; i < 28; i++) {

    el.style.position   = 'absolute';

    el.style.left       = Math.random() * 100 + '%';
    el.style.top        = (20 + Math.random() * 75) + '%';
    el.style.fontSize   = (sym === '🤍' ? (10 + Math.random()*12) : (8 + Math.random()*14)) + 'px';
    el.style.color      = sym === '🤍' ? '#ffffff' : (Math.random() > .4 ? '#A8FFD8' : '#F2EDE4');
    el.style.opacity    = '0';
    var dur = 5 + Math.random() * 7;
    var del = Math.random() * 8;
    el.style.animation  = 'floatParticle ' + dur + 's ease-in-out ' + del + 's infinite';
    container.appendChild(el);
  }
})();

/* ═══════════════════════════════════════════════════════
   PHOTO: load with fallback + 3D tilt
═══════════════════════════════════════════════════════ */
(function initPhoto() {
  var img      = document.getElementById('hero-img');
  var fallback = document.getElementById('photo-fallback');
  var card     = document.getElementById('photo-card');

  img.addEventListener('error', function() {
    img.style.display   = 'none';
    fallback.style.display = 'flex';
  });

  // 3-D tilt
  function tilt(x, y, rect) {
    var cx = rect.left + rect.width  / 2;
    var cy = rect.top  + rect.height / 2;
    var dx = (x - cx) / (rect.width  / 2);
    var dy = (y - cy) / (rect.height / 2);
    card.style.transform = 'rotateY(' + (dx*9) + 'deg) rotateX(' + (-dy*9) + 'deg) translateY(-4px)';
  }

  window.addEventListener('mousemove', function(e) {
    var rect = card.getBoundingClientRect();
    if (rect.width > 0) tilt(e.clientX, e.clientY, rect);
  });
  card.addEventListener('mouseleave', function() {
    card.style.transform = '';
  });
  card.addEventListener('touchmove', function(e) {
    var t = e.touches[0];
    var rect = card.getBoundingClientRect();
    if (rect.width > 0) tilt(t.clientX, t.clientY, rect);
  }, { passive: true });
  card.addEventListener('touchend', function() {
    card.style.transform = '';
  });
})();

/* ═══════════════════════════════════════════════════════
   AUDIO  — Web Audio API synthesized "Happy Birthday"
   Piano + shimmer + reverb. No file needed.
   Falls back gracefully if Web Audio unavailable.
   If assets/music.mp3 exists it takes priority.
═══════════════════════════════════════════════════════ */
var muteBtn  = document.getElementById('mute-btn');
var audioCtx = null;
var masterGain = null;
var isMuted  = false;
var synthLoopTimer = null;
var audioStarted = false;

// Happy Birthday melody: [note semitones from C4, duration in beats]
// Key of F (C=0, D=2, E=4, F=5, G=7, A=9, Bb=10, C5=12)
// F  F  G  F  Bb A | F  F  G  F  C' Bb | F  F  F5 D' Bb A  G | Eb Eb D' Bb C' Bb
var HB_NOTES = [
  // "Hap-py Birth-day to you"
  [5,0.75],[5,0.25],[7,1],[5,1],[10,1],[9,2],
  // "Hap-py Birth-day to you"
  [5,0.75],[5,0.25],[7,1],[5,1],[12,1],[10,2],
  // "Hap-py Birth-day dear Ni-ya-ti"
  [5,0.75],[5,0.25],[17,1],[14,1],[10,1],[9,1],[7,2],
  // "Hap-py Birth-day to you"
  [15,0.75],[15,0.25],[14,1],[10,1],[12,1],[10,2.5],
];

var BEAT = 0.52; // seconds per beat — gentle waltz tempo

// Convert semitone offset from C4 to Hz
function noteHz(semi) {
  return 261.63 * Math.pow(2, semi / 12);
}

// Pluck a soft piano-like tone: sine + small triangle + reverb tail
function pluckNote(ctx, gain, freq, startTime, dur) {
  var osc1 = ctx.createOscillator();
  var osc2 = ctx.createOscillator();
  var env  = ctx.createGain();

  osc1.type = 'sine';
  osc1.frequency.value = freq;
  osc2.type = 'triangle';
  osc2.frequency.value = freq * 2.001; // slight detune for shimmer

  var g1 = ctx.createGain();
  var g2 = ctx.createGain();
  g1.gain.value = 0.6;
  g2.gain.value = 0.18;

  osc1.connect(g1); g1.connect(env);
  osc2.connect(g2); g2.connect(env);
  env.connect(gain);

  // Attack → long piano decay
  env.gain.setValueAtTime(0, startTime);
  env.gain.linearRampToValueAtTime(0.9, startTime + 0.01);
  env.gain.exponentialRampToValueAtTime(0.3, startTime + 0.15);
  env.gain.exponentialRampToValueAtTime(0.001, startTime + dur * BEAT * 1.4 + 0.3);

  osc1.start(startTime);
  osc2.start(startTime);
  osc1.stop(startTime + dur * BEAT * 1.4 + 0.5);
  osc2.stop(startTime + dur * BEAT * 1.4 + 0.5);
}

// Add a soft ambient shimmer pad underneath (sine waves at chord tones)
function startPad(ctx, gain) {
  var padFreqs = [174.61, 220, 261.63, 349.23]; // F3 chord
  padFreqs.forEach(function(f) {
    var osc = ctx.createOscillator();
    var g   = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    g.gain.value = 0.025;
    osc.connect(g);
    g.connect(gain);
    osc.start();
    // Store so we can stop later
    osc._padNode = true;
    gain._padOscs = gain._padOscs || [];
    gain._padOscs.push(osc);
  });
}

function scheduleMelody(ctx, gain, startTime) {
  var t = startTime;
  HB_NOTES.forEach(function(nd) {
    pluckNote(ctx, gain, noteHz(nd[0]), t, nd[1]);
    t += nd[1] * BEAT;
  });
  return t; // time when melody ends
}

function startSynth() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) throw new Error('no WebAudio');
    audioCtx   = new AudioCtx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);

    // Soft reverb via convolver with synthetic impulse
    var convolver = audioCtx.createConvolver();
    var irLen = audioCtx.sampleRate * 2;
    var irBuf = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = irBuf.getChannelData(c);
      for (var i = 0; i < irLen; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.5);
      }
    }
    convolver.buffer = irBuf;
    var reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.28;
    masterGain.connect(convolver);
    convolver.connect(reverbGain);
    reverbGain.connect(audioCtx.destination);

    startPad(audioCtx, masterGain);

    // Loop melody
    function loopMelody() {
      var now = audioCtx.currentTime;
      var endTime = scheduleMelody(audioCtx, masterGain, now + 0.1);
      var totalLen = (endTime - now - 0.1) * 1000 + 1500;
      synthLoopTimer = setTimeout(loopMelody, totalLen);
    }
    loopMelody();

    muteBtn.classList.remove('hidden');
  } catch(e) {
    // Web Audio not available — try mp3 file
    tryMp3Audio();
  }
}

function tryMp3Audio() {
  try {
    var el = new Audio('./assets/music.mp3');
    el.loop = true;
    el.volume = 0.25;
    el.addEventListener('error', function() { muteBtn.classList.add('hidden'); });
    var p = el.play();
    if (p && p.then) p.then(function() { muteBtn.classList.remove('hidden'); }).catch(function() {});
    muteBtn._mp3el = el;
  } catch(e) {}
}

function initAudio() {
  startSynth();
}

muteBtn.addEventListener('click', function() {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';

  if (masterGain) {
    // Smooth fade
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(
      isMuted ? 0.0001 : 0.55,
      audioCtx.currentTime + 0.4
    );
  } else if (muteBtn._mp3el) {
    var el = muteBtn._mp3el;
    if (isMuted) el.pause(); else el.play();
  }
});

/* ═══════════════════════════════════════════════════════
   TYPEWRITER
═══════════════════════════════════════════════════════ */
var MESSAGE = [
  '\u201cOut of all the stars in the universe,\nI found my favourite one in you.\u201d\n\n',
  'Every day with you feels like a gentle little miracle.\n',
  'You make my world softer, brighter,\nand so much more beautiful.\n\n',
  'Happy Birthday, my love.\n',
  'I\u2019m so lucky it\u2019s you. 🤍'
].join('');

var twEl    = document.getElementById('typewriter-text');
var twTimer = null;
var twIdx   = 0;

function startTypewriter() {
  twEl.innerHTML = '';
  twIdx = 0;
  if (twTimer) clearInterval(twTimer);

  var cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '|';
  twEl.appendChild(cursor);

  twTimer = setInterval(function() {
    if (twIdx >= MESSAGE.length) {
      clearInterval(twTimer); twTimer = null;
      return;
    }
    var ch = MESSAGE[twIdx++];
    var node = document.createTextNode(ch === '\n' ? '' : '');
    if (ch === '\n') {
      twEl.insertBefore(document.createElement('br'), cursor);
    } else {
      twEl.insertBefore(document.createTextNode(ch), cursor);
    }
  }, 42);
}

/* ═══════════════════════════════════════════════════════
   SCREEN TRANSITIONS
═══════════════════════════════════════════════════════ */
var screen1    = document.getElementById('screen-1');
var screen2    = document.getElementById('screen-2');
var openBtn    = document.getElementById('open-btn');
var replayBtn  = document.getElementById('replay-btn');
var sfBg       = document.getElementById('starfield-bg');

function toReveal() {
  // Trigger audio on first user gesture
  initAudio();

  // Warp surge
  sfBg.style.transform = 'scale(1.2)';
  sfBg.style.filter    = 'brightness(1.6) contrast(1.2)';

  screen1.classList.remove('state-active');
  screen1.classList.add('state-exit');
  screen2.setAttribute('aria-hidden', 'false');

  setTimeout(function() {
    sfBg.style.transform = '';
    sfBg.style.filter    = '';
    screen2.classList.remove('state-enter');
    screen2.classList.add('state-active');
    startTypewriter();
    screen2.scrollTop = 0;
  }, 700);
}

function toSurprise() {
  screen2.classList.remove('state-active');
  screen2.classList.add('state-enter');
  screen2.setAttribute('aria-hidden', 'true');

  if (twTimer) { clearInterval(twTimer); twTimer = null; }
  twEl.innerHTML = '';

  setTimeout(function() {
    screen1.classList.remove('state-exit');
    screen1.classList.add('state-active');
  }, 500);
}

openBtn.addEventListener('click',   toReveal);
replayBtn.addEventListener('click', toSurprise);

// Touch tap also works
openBtn.addEventListener('touchend', function(e) { e.preventDefault(); toReveal(); }, { passive: false });
</script>
